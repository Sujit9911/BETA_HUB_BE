spring.application.name=hub-backend

# ===============================
# PostgreSQL - Render
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ===============================
# Hikari Connection Pool
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
spring.main.lazy-initialization=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# Cloudinary
# ===============================
cloudinary.cloud-name=${CLOUD_API_NAME}
cloudinary.api-key=${CLOUD_API_KEY}
cloudinary.api-secret=${CLOUD_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Gemini
# ===============================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

# ===============================
# Brevo
# ===============================
brevo.api-key=${B_API_KEY}
brevo.sender-email=${B_API_EMAIL}
brevo.sender-name=${B_API_SENDER}

# ===============================
# Server
# ===============================
server.port=${PORT:10000}
server.address=0.0.0.0